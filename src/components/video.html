<section id="harborshine-video-section" aria-labelledby="video-section-heading"
  class="w-full bg-white-pure py-12 lg:py-24">
  <div class="container mx-auto px-4 sm:px-6">

    <!-- Section Header -->
    <div class="w-full mb-10 text-center">
      <p class="uppercase font-bold text-cyan-brand-dark mb-6">Happy To Help</p>

      <!-- Main header -->
      <h3 id="video-section-heading"
        class="h-medium font-semibold uppercase tracking-wide text-dark-slate flex flex-row justify-center items-center flex-wrap md:flex-nowrap gap-x-2">
        <span>The</span>
        <span class="font-cursive text-[3rem] text-yellow-gold tracking-wider">Starting</span>
        <span>Point</span>
      </h3>
    </div>

    <!-- Video Container -->
    <div
      class="relative w-full max-w-6xl mx-auto aspect-video rounded-[30px] overflow-hidden bg-dark-slate ring-1 ring-dark-slate/10 shadow-2xl group">
      <video id="promo-video" class="w-full h-full object-cover cursor-pointer" preload="metadata" playsinline>
        <source src="/media/videos/Move-out Junk removal Deep Clean.mp4" type="video/mp4">

        <track kind="captions" src="/media/videos/captions.vtt" srclang="en" label="English captions">

        <p>Your browser does not support HTML video. <a href="/media/videos/Move-out Junk removal Deep Clean.mp4"
            class="underline text-yellow-gold">Download the video instead.</a></p>
      </video>

      <!-- RESTART BUTTON (Top Right) -->
      <button id="video-restart-btn" type="button" aria-label="Reiniciar video desde el inicio con sonido"
        class="absolute top-4 right-4 md:top-6 md:right-6 z-20 flex items-center gap-2 bg-dark-slate/70 hover:bg-dark-slate text-white-pure px-4 py-2 rounded-full backdrop-blur-sm transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yellow-gold cursor-pointer">
        <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span class="font-bold text-xs md:text-sm tracking-wider uppercase">Reiniciar</span>
      </button>

      <!-- PLAY / PAUSE BUTTON (Bottom Right) -->
      <div class="absolute bottom-4 right-4 md:bottom-6 md:right-6 z-20">
        <button id="video-toggle-btn" type="button" aria-pressed="false" aria-label="Reproducir video"
          class="flex items-center justify-center w-12 h-12 md:w-16 md:h-16 bg-yellow-gold text-dark-slate rounded-full shadow-lg transition-transform duration-300 hover:scale-110 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-white-pure cursor-pointer">

          <!-- Play Icon (Visible at start since video is paused) -->
          <svg class="play-icon w-6 h-6 md:w-8 md:h-8 ml-1" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>

          <!-- Pause Icon (Hidden at start) -->
          <svg class="pause-icon w-6 h-6 md:w-8 md:h-8 hidden" fill="currentColor" viewBox="0 0 24 24"
            aria-hidden="true">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
